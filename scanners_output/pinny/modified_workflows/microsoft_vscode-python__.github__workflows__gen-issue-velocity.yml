name: Issues Summary

on:
  schedule:
    - cron: '0 0 * * 2' # Runs every Tuesday at midnight
  workflow_dispatch:

permissions:
  issues: read

jobs:
  generate-summary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # actions/setup-python@v6 | main,v6.2.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run summary script
        run: python scripts/issue_velocity_summary_script.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
