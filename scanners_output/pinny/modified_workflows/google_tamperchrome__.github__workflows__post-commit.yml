name: Post Commit Checks

on:
  push:
    branches: [ master ]

  workflow_dispatch:

jobs:
  ui_e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # actions/checkout@v2 | releases,850,v2.7.0
      
      - name: Install deps
        run: sudo npm install -g @angular/cli

      - name: Check UI e2e tests
        uses: nick-invision/retry@14672906e672a08bd6eeb15720e9ed3ce869cdd4 # nick-invision/retry@v2 | v2.9.0
        with:
          timeout_minutes: 10
          max_attempts: 10
          command: cd v2 && make e2e

  background_e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # actions/checkout@v2 | releases,850,v2.7.0
      
      - name: Install deps
        run: sudo npm install -g @angular/cli

      - name: Check background e2e tests
        uses: GabrielBB/xvfb-action@86d97bde4a65fe9b290c0b3fb92c2c4ed0e5302d # GabrielBB/xvfb-action@v1 | v1.6
        with:
          working-directory: ./v2
          run: make background/test
