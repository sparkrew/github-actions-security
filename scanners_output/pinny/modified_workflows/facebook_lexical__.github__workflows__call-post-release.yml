name: (call) Post-release branch with updated examples
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'git ref (main)'
        required: true
        type: string
        default: main
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
        default: main
jobs:
  post-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - id: latest
        uses: pozetroninc/github-action-get-latest-release@53d33d213ee71c72360e3c829caf7cee94ec21e2 # pozetroninc/github-action-get-latest-release@master
        with:
          owner: facebook
          repo: lexical
          excludes: draft
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4 | releases,v4.4.0
        with:
          node-version: 22.x
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # pnpm/action-setup@v4
        with:
          version: 9
      - run: |
          pnpm install && pnpm run update-examples
      - uses: stefanzweifel/git-auto-commit-action@778341af668090896ca464160c2def5d1d1a3eb0 # stefanzweifel/git-auto-commit-action@v6 | v6.0.1
        with:
          commit_message: 'Update examples for ${{ steps.latest.outputs.release }}'
          commit_user_name: 'Lexical GitHub Actions Bot'
          branch: post-release-${{ steps.latest.outputs.release }}
          push_options: '--force'
