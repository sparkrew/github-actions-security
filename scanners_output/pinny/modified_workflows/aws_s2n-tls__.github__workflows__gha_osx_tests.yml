---
name: macOS build and test S2n

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

jobs:
  OSX:
    runs-on: macos-latest
    steps:
      - name: Checkout Dependencies
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2

      - name: Prebuild
        run: |
          .github/install_osx_dependencies.sh

      - name: Build
        run: |
          .github/s2n_osx.sh
