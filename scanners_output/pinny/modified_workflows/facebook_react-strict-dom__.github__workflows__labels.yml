name: labels

on:
  issues:
    types: [labeled, unlabeled]
  pull_request:
    types: [labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
      - uses: dessant/label-actions@102faf474a544be75fbaf4df54e73d3c515a0e65 # dessant/label-actions@v4
        with:
          config-path: .github/labels.yml
          github-token: ${{ github.token }}
