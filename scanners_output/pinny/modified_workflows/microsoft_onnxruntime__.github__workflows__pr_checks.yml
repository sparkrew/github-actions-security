name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:  # set top-level default permissions as security best practice
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  auto-apply-fixes:
    name: Suggest fixes
    runs-on: [
        "self-hosted",
        "1ES.Pool=onnxruntime-github-Ubuntu2204-AMD-CPU",
        "JobId=pr-auto-apply-fixes-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
        ]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # actions/setup-python@v6 | main,v6.2.0
        with:
          python-version: "3.10"
      - name: Setup Rust
        uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Update PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies and run lintrunner on all files
        run: |
          python -m pip install --user -r requirements-dev.txt
          python -m pip install --user lintrunner lintrunner-adapters
          lintrunner init
          set +e
          lintrunner f --all-files -v
          exit 0
      - uses: parkerbxyz/suggest-changes@1dca834e5b0f48239dd6d0ddc2df247dae4052cf # parkerbxyz/suggest-changes@v3 | main,v3.0.4
        with:
          comment: 'You can commit the suggested changes from lintrunner.'
