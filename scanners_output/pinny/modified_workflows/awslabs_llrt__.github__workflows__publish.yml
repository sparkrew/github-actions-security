name: Publish crates
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    secrets:
      CRATES_IO_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # actions-rust-lang/setup-rust-toolchain@v1 | main,v1.15,v1.15.3
        with:
          toolchain: stable
      - name: Publish utils
        working-directory: ./llrt_utils
        run: |
          cargo publish
          sleep 10
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      - name: Publish modules
        working-directory: ./llrt_modules
        run: |
          cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
