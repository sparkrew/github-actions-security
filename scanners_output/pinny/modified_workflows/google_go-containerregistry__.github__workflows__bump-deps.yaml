name: Bump Deps

on:
  schedule:
  - cron: '0 6 * * 2' # weekly at 6AM Tuesday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-deps:
    name: Bump Deps

    # Don't bother bumping deps on forks.
    if: ${{ github.repository == 'google/go-containerregistry' }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
    - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # actions/setup-go@v6 | v6.3.0
      with:
        go-version-file: go.mod

    - run: ./hack/bump-deps.sh
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # peter-evans/create-pull-request@v8 | v8.1.0
      with:
        title: "Bump dependencies using hack/bump-deps.sh"
        commit-message: "Bump dependencies using hack/bump-deps.sh"
        labels: dependencies
        assignees: imjasonh
        delete-branch: true
