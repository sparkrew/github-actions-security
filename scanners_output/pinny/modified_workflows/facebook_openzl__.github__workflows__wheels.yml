name: Wheels

on:
  workflow_dispatch:

  pull_request:
    paths: &wheel_paths
      - 'py/**'
      - 'cpp/**'
      - 'src/**'
      - 'include/**'
      - 'tools/sddl/**'
      - 'tools/sddl2/**'
      - 'CMakeLists.txt'
      - 'build-scripts/**'
      - '.github/workflows/wheels.yml'

  push:
    branches:
      - dev
    paths: *wheel_paths

  release:
    types:
      - published


jobs:
  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
      with:
        submodules: true

    - name: Build SDist
      run: pipx run build --sdist py

    - name: Check metadata
      run: pipx run twine check py/dist/*

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4 | v4.6.2
      with:
        name: dist-sdist
        path: py/dist/*.tar.gz


  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Once MSVC is supported we can build Windows packages as well by adding windows-latest
        # Once we're public we can build on ubuntu-24.04-arm & windows-11-arm.
        # They are not supported for private repos.
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
      with:
        submodules: true

    - uses: pypa/cibuildwheel@5f22145df44122af0f5a201f93cf0207171beca7 # pypa/cibuildwheel@v3.0.0
      with:
        package-dir: py

    - name: Verify clean directory
      run: git diff --exit-code
      shell: bash

    - name: Upload wheels
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4 | v4.6.2
      with:
        path: wheelhouse/*.whl
        name: dist-${{ matrix.os }}

  # This can be uncommented to support automatic uploads to PyPI on release
  # once OpenZL is publicly available.
  upload_all:
    name: Upload if release
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5 | releases,v5.6.0
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4 | v4.3.0
      with:
        path: dist
        pattern: dist-*
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # pypa/gh-action-pypi-publish@release/v1 | release
      with:
        user: __token__
        password: ${{ secrets.pypi_password }}
