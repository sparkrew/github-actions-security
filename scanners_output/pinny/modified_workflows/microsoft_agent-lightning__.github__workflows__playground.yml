# Pre-defined workflow with workflow_dispatch trigger,
# convenient for testing and debugging.

name: Playground
permissions:
  contents: read
on:
  workflow_dispatch:

jobs:
  playground:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
      - name: Run script
        run: |
          echo "Hello, world!"
