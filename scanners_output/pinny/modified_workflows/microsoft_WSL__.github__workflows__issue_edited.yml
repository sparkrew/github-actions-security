name: Process edited issue

on:
  workflow_dispatch:
  issues:
    types: [edited]

jobs:
  wti:
    name: Run wti
    runs-on: windows-2022
    permissions:
      issues: write
    steps: 
    - name: Checkout repo
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1

    - uses: ./.github/actions/triage
      with: 
        issue: "${{ github.event.issue.number }}"
        previous_body: "${{ github.event.changes.body.from }}"
        token: ${{ secrets.GITHUB_TOKEN }}
