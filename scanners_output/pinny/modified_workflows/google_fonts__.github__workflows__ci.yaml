# Check to_sandbox.txt and to_production.txt do not contain typos
name: Continuous Test

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
    - "cc-by-sa/*"
    - ".github/workflows/ci.yaml"
    - "/.github/workflows/knowledge_graph.py"
  pull_request:
    branches: ['**']
    paths:
    - "cc-by-sa/*"
    - "to_*.txt"
    - ".github/workflows/ci.yaml"

jobs:
  check_knowledge_graph:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # actions/checkout@v3 | releases,v3.6.0
    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # actions/setup-python@v4 | restore-v4-release,v4.9.1
      with:
        python-version: "3.10"
    - name: Install Cairo (Ubuntu)
      run: sudo apt-get install libcairo2-dev

    # Check Knowledge link graph
    - name: Install dependencies
      run: pip install absl-py mistune gftools
    - name: Check Knowledge graph
      run: python3 .github/workflows/knowledge_graph.py --check_outbound_links
