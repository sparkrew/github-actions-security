name: pkg-pr-new

on:
  pull_request:
    branches: [dev, main]

jobs:
  pkg-pr-new:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4 | releases,v4.4.0
        with:
          node-version-file: .node-version
          cache: 'yarn'

      - name: Install dependencies
        run: yarn
      - name: Build package
        run: yarn build
      - name: Publish preview package
        run: |
          npx pkg-pr-new publish './packages/cherry-markdown' --compact --packageManager=pnpm,npm,yarn
