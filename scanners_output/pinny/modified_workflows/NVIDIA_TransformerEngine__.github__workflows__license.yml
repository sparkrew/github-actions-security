# A workflow to trigger the TE license check on GitHub
name: 'License'
on:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    name: 'Check'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # actions/checkout@v3 | releases,v3.6.0
      - name: 'Check License'
        run: |
          export TE_PATH=.
          bash ./qa/L0_license/test.sh
