name: auto-changelog

on:
  pull_request:
    types: [opened]

  pull_request_review:
    types: [submitted]

  issue_comment:
    types: [edited]

jobs:
  changelog:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - run: echo ${{ github.event.pull_request.number }} > pr-id.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4 | v4.6.2
        with:
          name: pr-id
          path: pr-id.txt
          retention-days: 5

  comment-release-changelog:
    if: github.event.pull_request && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: auto-changelog
        uses: TDesignOteam/flow-pilot-action@4ca34fe6e8072e43d007729e0db81b93685f428f # TDesignOteam/flow-pilot-action@develop
        with:
          token: ${{ secrets.TDESIGN_BOT_TOKEN }}
          packages: 'tdesign-vue-next,@tdesign-vue-next/chat,@tdesign-vue-next/auto-import-resolver'
          translate-secret-id: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          translate-secret-key: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}

  commit-changelog:
    if: github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: auto-changelog
        uses: TDesignOteam/flow-pilot-action@4ca34fe6e8072e43d007729e0db81b93685f428f # TDesignOteam/flow-pilot-action@develop
        with:
          token: ${{ secrets.TDESIGN_BOT_TOKEN }}
          packages: 'tdesign-vue-next,@tdesign-vue-next/chat,@tdesign-vue-next/auto-import-resolver'
