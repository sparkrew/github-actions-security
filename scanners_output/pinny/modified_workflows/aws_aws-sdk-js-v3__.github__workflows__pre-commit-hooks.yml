name: pre-commit hooks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-pre-commit-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # actions/checkout@v5 | releases,v5.0.1
      - name: set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # actions/setup-node@v5 | releases,v5.0.0
        with:
          node-version: '20'
          cache: 'yarn'

      - name: install dependencies
        run: yarn install --frozen-lockfile

      - name: run pre-commit hooks
        run: |
          yarn lint-staged
          yarn lint:versions
          yarn lint:dependencies
