name: genai linters
on:
    workflow_dispatch:
    pull_request:
        types: [opened, ready_for_review, reopened, review_requested]
        paths:
            - "docs/**"
            - "genaisrc/**"
            - "packages/core/**/*"
            - "packages/cli/**/*"
            - "packages/samples/**/*"
            - "packages/vscode/**/*"
concurrency:
    group: linters-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
env:
    GENAISCRIPT_MODEL_LINTER: ${{ vars.GENAISCRIPT_MODEL_LINTER }}
jobs:
    lint:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
            models: read
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
              with:
                  submodules: "recursive"
                  fetch-depth: 10
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4 | releases,v4.4.0
              with:
                  node-version: "22"
                  cache: yarn
            - run: yarn install --frozen-lockfile
            - name: compile
              run: yarn compile
            - name: git stuff
              run: git fetch origin && git pull origin dev:dev
            - name: genaiscript
              run: node packages/cli/built/genaiscript.cjs run linters --out ./temp/genai/linters -prr -prc -m linter --out-trace $GITHUB_STEP_SUMMARY --vars defaultBranch=dev
              continue-on-error: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_COMMIT_SHA: ${{ github.event.pull_request.base.sha}}
            - name: Archive genai results
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4 | v4.6.2
              with:
                  name: genai-results
                  path: ./temp/genai/**
