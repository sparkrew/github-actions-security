name: Check Designer profiles

on:
  pull_request:
    paths:
    - 'catalog/designers/*/*'

jobs:
  test_designer_profiles:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # actions/checkout@v1
    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # actions/setup-python@v4 | restore-v4-release,v4.9.1
      with:
        python-version: "3.10"
      
    - name: Install dependencies
      run: pip install gftools[qa] pytest
    - name: Check designer profiles
      run: |
        python3 .ci/run.py --pr-number $PR_NUMBER --pr-url-body https://www.github.com/google/fonts/pull/
      env:
        PYTHONIOENCODING: 'utf-8'
        PYTHONUTF8: '1'
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.number }}
