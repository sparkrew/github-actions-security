name: Docusaurus

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-compiler-explorer:
    name: Build Compiler Explorer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # actions-rs/toolchain@v1
        with:
          # Should stay in sync with fbcode/buck2/rust-toolchain
          # And other similar references in this file and
          # ci.yml
          toolchain: nightly-2025-12-05
          override: true
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: "Build Compiler Playground Wasm NPM package"
        run: wasm-pack build --target web
        working-directory: ./compiler/crates/relay-compiler-playground
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # actions/upload-artifact@v6 | v6.0.0
        with:
          name: compiler-playground-package
          path: compiler/crates/relay-compiler-playground/pkg/

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [build-compiler-explorer]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # actions/setup-node@v6 | main,v6.3.0
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: website/yarn.lock

      - name: Set up Docusaurus Build Cache
        id: cache-docusaurus
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # actions/cache@v5 | v5.0.3
        with:
          path: |
            website/node_modules/.cache
            website/.docusaurus
          key: "docusaurus-build-${{ hashFiles('website/yarn.lock') }}"

      - name: Download Compiler Explorer
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # actions/download-artifact@v7 | v7.0.0
        with:
          name: compiler-playground-package
          path: tmp/compiler-playground-package

      - name: Link Compiler Explorer
        run: yarn link
        working-directory: tmp/compiler-playground-package

      - name: Install and Build
        run: |
          yarn
          yarn link relay-compiler-playground
          yarn build
        working-directory: website/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # JamesIves/github-pages-deploy-action@v4 | releases,v4.8.0
        with:
          branch: gh-pages
          folder: website/build
          clean: true
