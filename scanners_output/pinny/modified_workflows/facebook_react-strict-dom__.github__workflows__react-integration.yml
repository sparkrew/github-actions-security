name: react@next integration

on:
  schedule:
    # Run every Monday at 12:00 (see https://crontab.guru)
    - cron: '0 12 * * 1'

jobs:
  react-next:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
    - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # actions/setup-node@v6 | main,v6.3.0
      with:
        node-version: '20.x'
    - run: npm install --force --include-workspace-root --workspaces react@next react-dom@next react-native@nightly react-test-renderer@next
    # Run the unit tests
    - run: npm run jest
