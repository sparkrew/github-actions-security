name: Update Status Chart
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: ${{ github.repository == 'microsoft/STL' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
        with:
          ref: gh-pages
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # actions/setup-node@v6 | main,v6.3.0
        with:
          node-version: ">=25.2.1"
      - name: Install Packages
        run: |
          npm ci
      - name: Compile And Run gather_stats.mts
        run: |
          SECRET_GITHUB_PERSONAL_ACCESS_TOKEN="${{ github.token }}" npm run gather
      - name: Compile And Bundle status_chart.mts
        run: |
          npm run make
      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/daily_table.mts src/monthly_table.mts built/status_chart.mjs
          git diff-index --quiet HEAD || git commit -m "Automated update."
          git push origin gh-pages
