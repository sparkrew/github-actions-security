name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  git-secrets:
    runs-on: 'ubuntu-22.04'
    steps:
      - name: Pull latest awslabs/git-secrets repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
        with:
          repository: awslabs/git-secrets
          ref: 1.3.0
          fetch-tags: true
          path: git-secrets
      - name: Install git secrets from source
        run: sudo make install
        working-directory: git-secrets
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
      - name: Scan repository for git secrets
        run: |
          git secrets --register-aws
          git secrets --scan-history

  cross-compile:
    runs-on: 'ubuntu-22.04'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
      - name: Cross-compile all variants
        run: make all-variants-in-docker

  unit-test:
    strategy:
      matrix:
        go: ['1.25', '1.26']

        # Intentionally use specific versions instead of "latest" to
        # make this build reproducible.
        os: ['ubuntu-24.04', 'macos-15', 'windows-2025']

      # Build all variants regardless of failures
      fail-fast: false
    name: unit-test (${{ matrix.os }} / Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # actions/setup-go@v6 | v6.3.0
        with:
          go-version: ${{ matrix.go }}
      - run: make test
