name: Deploy GitHub Pages

on:
  workflow_dispatch:

env:
  GITHUB_SERVICE_USER: "Microsoft FAST Builds"
  GITHUB_SERVICE_EMAIL: "fastsvc@microsoft.com"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.x]

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4 | releases,v4.4.0
      with:
        node-version: ${{ matrix.node-version }}
        fetch-depth: 0

    - name: Set Git User
      run: |
        git config --global user.name "${{ env.GITHUB_SERVICE_USER }}"
        git config --global user.email "${{ env.GITHUB_SERVICE_EMAIL }}"

    - name: Cache multiple paths
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache@v4 | v4.3.0
      env:
        cache-name: cache-node-modules
      with:
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Install package dependencies
      run: npm ci

    - name: Build workspaces
      run: npm run build

    - name: Build GitHub Pages
      run: npm run build:gh-pages

    - name: Deploy GitHub Pages
      uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # JamesIves/github-pages-deploy-action@v4 | releases,v4.8.0
      with:
        token: ${{ secrets.GH_TOKEN }}
        branch: gh-pages # The branch the action should deploy to.
        folder: sites/website/build # The folder the action should deploy.
        target-folder: docs # The folder on the branch to deploy to.
        clean: true # Remove old files to clean up unique hash files.
        single-commit: true # Only use a single commit to keep the branch free from git history.
