name: Unit tests

on: pull_request

jobs:
  full_test_run:

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
      with:
        submodules: true

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4 | releases,v4.4.0

    - name: NPM install
      run: npm ci

    - name: Install playwright browsers
      run: npx playwright install --with-deps

    # - name: Lint TypeScript sources
    #   run: npm run lint

    - name: Build packages
      run: npm run build

    - name: Unit tests
      run: npm run test:ci
