name: pr-linter-exemption-labeler
on:
  issue_comment:
    types:
      - created
      - edited
      - deleted

jobs:
  pr_commented:
    name: PR Comment
    if: ${{ (github.event.issue.pull_request) && (github.event.issue.state == 'open') }}
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: cdklabs/pr-linter-exemption-labeler@e3969ee63c499f2f3ef4f66d8d1a307246969dbc # cdklabs/pr-linter-exemption-labeler@main
        with:
          github-token: ${{ secrets.PROJEN_GITHUB_TOKEN }}
