name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch: # allows manual triggering
jobs:
  linux-build-and-test:
    runs-on: 4-core-ubuntu
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
    - uses: ./.github/actions/setup_linux_env
    - uses: ./.github/actions/build_debug
    - uses: ./.github/actions/run_test_py
  macos-build-and-test:
    runs-on: macos-latest
    steps:
    - uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # maxim-lobanov/setup-xcode@v1.6.0
      with:
        xcode-version: 16.4.0
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
    - uses: ./.github/actions/setup_macos_env
    - uses: ./.github/actions/build_debug
    - uses: ./.github/actions/run_test_py
  windows-build-and-test:
    runs-on: windows-8-core
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
    - uses: ./.github/actions/setup_windows_env
    - uses: ./.github/actions/build_debug
    - uses: ./.github/actions/run_test_py
