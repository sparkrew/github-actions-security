# GitHub Actions workflow to set up and build Infer in different development environments

name: devsetup

on:
  - pull_request

jobs:
  devsetup-build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-15-intel
        ocaml-compiler:
          - ocaml-variants.5.3.0+options
        build-mode:
          - user-opam-switch
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install automake coreutils zlib

      - name: Setup Java SDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # actions/setup-java@v5 | v5.2.0
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@dec6499fef64fc5d7ed43d43a87251b7b1c306f5 # ocaml/setup-ocaml@v3 | v3.4.8
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - run: ./build-infer.sh --yes --${{ matrix.build-mode }} java
      - run: make -C infer/src clean
      - run: make -j -C infer/src byte
      - run: make -j direct_sil_pulse_test
      - run: make -j direct_java_pulse_test
