name: Python Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # actions/setup-python@v6 | main,v6.2.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # astral-sh/setup-uv@v7

    - name: Install dependencies
      run: |
        uv venv .venv
        source .venv/bin/activate
        uv sync --extra test

    - name: Run unit tests with pytest
      run: |
        source .venv/bin/activate
        pytest tests/unittests \
          --ignore=tests/unittests/artifacts/test_artifact_service.py \
          --ignore=tests/unittests/tools/google_api_tool/test_googleapi_to_openapi_converter.py
