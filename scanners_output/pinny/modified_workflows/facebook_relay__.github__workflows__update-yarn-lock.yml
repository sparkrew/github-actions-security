name: Update yarn.lock
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-yarn-lock:
    name: Update yarn.lock file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # actions/checkout@v2 | releases,850,v2.7.0
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # actions/setup-node@v3 | releases,v3.9.1
        with:
          node-version: '18'
      - name: yarn install
        run: yarn install
      - name: pull-request
        uses: peter-evans/create-pull-request@38e0b6e68b4c852a5500a94740f0e535e0d7ba54 # peter-evans/create-pull-request@v4 | v4.2.4
        with:
          title: "Update yarn.lock"
          branch: update-yarn-lock
          delete-branch: true
          # Use a PAT with permissions to act as relay-bot and bypass branch protection
          token: ${{ secrets.RELAY_BOT_GITHUB_PAT }}
