name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
    - name: Setup .NET Core
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # actions/setup-dotnet@v4 | releases,v4.3.1
      with:
        dotnet-version: |
          6.0.x
          8.0.x
          9.0.x
    
    - name: Install dependencies
      run: dotnet restore RulesEngine.sln
    
    - name: Build
      run: dotnet build RulesEngine.sln --configuration Release --no-restore
    
    - name: Test
      run: dotnet test RulesEngine.sln --collect:"XPlat Code Coverage" --no-build --configuration Release --verbosity m 

    - name: Generate Report
      shell: pwsh
      run: ./scripts/generate-coverage-report.ps1

    - name: Check Coverage
      shell: pwsh
      run: ./scripts/check-coverage.ps1 -reportPath coveragereport/Cobertura.xml -threshold 94
    
    - name: Coveralls GitHub Action
      uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b # coverallsapp/github-action@v2.3.6
      if: ${{ github.event_name == 'push' }}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: ./coveragereport/lcov.info
