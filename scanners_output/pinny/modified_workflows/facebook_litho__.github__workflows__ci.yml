name: General CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # actions/checkout@v3 | releases,v3.6.0
      - name: Set up JDK
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # actions/setup-java@v3 | releases,v3.14.1
        with:
          distribution: 'adopt'
          java-version: 17
      - name: Set up GCC
        uses: egor-tensin/setup-gcc@eaa888eb19115a521fa72b65cd94fe1f25bbcaac # egor-tensin/setup-gcc@v1 | v1.3
        with:
          version: latest
          platform: x64
      - name: Setup NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # actions/setup-python@v4 | restore-v4-release,v4.9.1
        with:
          python-version: '3.9.16'
      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # android-actions/setup-android@v3 | main,v3.2.2
      - name: Install CMake
        run: sdkmanager 'cmake;3.18.1'
      - name: Gradle caches
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # actions/cache@v3 | v3.5.0-working,1656,v3.5.0
        with:
          path: ~/.gradle/caches
          key: caches-${{ runner.os }}-${{ hashFiles('**/*.gradle') }}
      - name: Gradle wrapper caches
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # actions/cache@v3 | v3.5.0-working,1656,v3.5.0
        with:
          path: ~/.gradle/wrapper
          key: wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
      - name: Fetch buck
        run: |
          (rm -rf buck && mkdir buck && \
          wget https://jitpack.io/com/github/facebook/buck/v2022.05.05.01/buck-v2022.05.05.01-java11.pex && \
          mv buck-v2022.05.05.01-java11.pex buck/buck && \
          chmod +x buck/buck && \
          ls -l buck)
      - name: Build everything
        run: BUCK_PATH=`realpath buck/buck` ./gradlew assemble --stacktrace --no-daemon
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # actions/checkout@v3 | releases,v3.6.0
      - name: Set up JDK
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # actions/setup-java@v3 | releases,v3.14.1
        with:
          distribution: 'adopt'
          java-version: 17
      - name: Set up GCC
        uses: egor-tensin/setup-gcc@eaa888eb19115a521fa72b65cd94fe1f25bbcaac # egor-tensin/setup-gcc@v1 | v1.3
        with:
          version: latest
          platform: x64
      - name: Setup NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # actions/setup-python@v4 | restore-v4-release,v4.9.1
        with:
          python-version: '3.9.16'
      - name: Gradle caches
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # actions/cache@v3 | v3.5.0-working,1656,v3.5.0
        with:
          path: ~/.gradle/caches
          key: caches-${{ runner.os }}-${{ hashFiles('**/*.gradle') }}
      - name: Gradle wrapper caches
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # actions/cache@v3 | v3.5.0-working,1656,v3.5.0
        with:
          path: ~/.gradle/wrapper
          key: wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
      - name: Fetch buck
        run: |
          (rm -rf buck && mkdir buck && \
          wget https://jitpack.io/com/github/facebook/buck/v2022.05.05.01/buck-v2022.05.05.01-java11.pex && \
          mv buck-v2022.05.05.01-java11.pex buck/buck && \
          chmod +x buck/buck && \
          ls -l buck)
      - name: Run tests
        run: BUCK_PATH=`realpath buck/buck` ./gradlew test -x :litho-intellij-plugin:test -x :litho-core:test -x :litho-it:test --stacktrace --no-daemon
  deploy-check:
    name: Skip deploy if PR or Fork or not a SNAPSHOT version
    needs: [build, tests]
    if: ${{ github.event_name != 'pull_request' && github.repository == 'facebook/litho' }}
    runs-on: ubuntu-latest
    outputs:
      is-snapshot: ${{ steps.check_snapshot.outputs.IS_SNAPSHOT != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # actions/checkout@v3 | releases,v3.6.0
      - name: Check if SNAPSHOT version
        id: check_snapshot
        run: |
          echo "IS_SNAPSHOT=`grep 'VERSION_NAME=[0-9\.]\+-SNAPSHOT' gradle.properties)`" >> $GITHUB_OUTPUT
  deploy:
    needs: [deploy-check]
    if: ${{ needs.deploy-check.outputs.is-snapshot == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # actions/checkout@v3 | releases,v3.6.0
      - name: Set up JDK
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # actions/setup-java@v3 | releases,v3.14.1
        with:
          distribution: 'adopt'
          java-version: 17
      - name: Set up GCC
        uses: egor-tensin/setup-gcc@eaa888eb19115a521fa72b65cd94fe1f25bbcaac # egor-tensin/setup-gcc@v1 | v1.3
        with:
          version: latest
          platform: x64
      - name: Setup NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # nttld/setup-ndk@v1
        with:
          ndk-version: r26b
      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # actions/setup-python@v4 | restore-v4-release,v4.9.1
        with:
          python-version: '3.9.16'
      - name: Gradle caches
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # actions/cache@v3 | v3.5.0-working,1656,v3.5.0
        with:
          path: ~/.gradle/caches
          key: caches-${{ runner.os }}-${{ hashFiles('**/*.gradle') }}
      - name: Gradle wrapper caches
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # actions/cache@v3 | v3.5.0-working,1656,v3.5.0
        with:
          path: ~/.gradle/wrapper
          key: wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
      - name: Fetch buck
        run: |
          (rm -rf buck && mkdir buck && \
          wget https://jitpack.io/com/github/facebook/buck/v2022.05.05.01/buck-v2022.05.05.01-java11.pex && \
          mv buck-v2022.05.05.01-java11.pex buck/buck && \
          chmod +x buck/buck && \
          ls -l buck)
      - name: Publish Snapshot
        run: BUCK_PATH=`realpath buck/buck` ./gradlew uploadArchives --stacktrace
