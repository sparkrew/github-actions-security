name: playwright smoke tests
permissions:
    contents: read
on:
    workflow_dispatch:
    pull_request:
        paths:
            - yarn.lock
            - ".github/workflows/playwright.yml"
            - "packages/core/**/*"
            - "packages/cli/**/*"
    push:
        branches:
            - main
            - dev
        paths:
            - yarn.lock
            - ".github/workflows/playwright.yml"
            - "packages/core/**/*"
            - "packages/cli/**/*"
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}-playwright
    cancel-in-progress: true
jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
              with:
                  submodules: "recursive"
                  fetch-depth: 0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4 | releases,v4.4.0
              with:
                  node-version: "22"
                  cache: yarn
            - run: yarn install --frozen-lockfile
            - name: compile
              run: yarn compile:action
            - name: download ollama docker
              run: yarn ollama:start
            - name: run browse-text
              run: yarn run:script browse-text --out ./temp/browse-text --model ollama:smollm2:135m
