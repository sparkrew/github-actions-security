name: issue-reprioritization
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * 0"

jobs:
  issue-reprioritization:
    permissions:
      issues: write
      repository-projects: write
    runs-on: ubuntu-latest
    steps:
      - uses: cdklabs/issue-reprioritization-manager@34e0c957d4ee81700a784788145d27189cde253f # cdklabs/issue-reprioritization-manager@main
        id: reprioritization-manager
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          original-label: p2
          new-label: p1
          reprioritization-threshold: 20
          project-column-url: https://github.com/aws/aws-cdk/projects/13#column-18002436
      - uses: kaizencc/pr-triage-manager@3a2558737a4d072feaaa4c1768b92f51abfde53b # kaizencc/pr-triage-manager@main | v0.0.26
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          on-pulls: ${{ steps.reprioritization-manager.outputs.linked-pulls }}
