name: Lint with Black

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
      - uses: psf/black@6305bf1ae645ab7541be4f5028a86239316178eb # psf/black@stable | 26.1.0
        with:
          version: "24.8.0"
