name: PR Review
on: [pull_request]
jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
    - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: giraffate/clippy-action@13b9d32482f25d29ead141b79e7e04e7900281e0 # giraffate/clippy-action@v1 | v1.0.1
      with:
        reporter: 'github-pr-review'
        github_token: ${{ github.token }}
