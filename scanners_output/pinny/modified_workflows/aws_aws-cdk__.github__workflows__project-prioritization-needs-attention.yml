name: PR Prioritization Needs Attention Status
on:
  schedule:
    - cron: '0 7 * * 1-5'  # Runs at 7AM every day during weekdays
  workflow_dispatch:        # Manual trigger

jobs:
  update_project_status:
    if: github.repository == 'aws/aws-cdk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2

      - name: Update Needs Attention Status
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # actions/github-script@v8 | v8.0.0
        with:
          github-token: ${{ secrets.PROJEN_GITHUB_TOKEN }}
          script: |
            const script = require('./scripts/prioritization/update-attention-status.js')
            await script({github})
