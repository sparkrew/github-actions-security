name: force_push
on:
  push:
    branches:
      - main
permissions:
  contents: write

jobs:
  build:
    # This should only run in one place.
    if: contains(github.repository, 'aws/s2n-tls')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Push cbmc
        uses: ad-m/github-push-action@57116acb309081ee57864270b0e3c4cedbe45452 # ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.private_repos_s2n_20200214 }}
          repository: awslabs/private-s2n-cbmc
          branch: master
          force: true
      - name: Push fuzz
        uses: ad-m/github-push-action@57116acb309081ee57864270b0e3c4cedbe45452 # ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.private_repos_s2n_20200214 }}
          repository: awslabs/private-s2n-fuzz
          branch: master
          force: true
