---
name: PR Title Validation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
    branches: [main]
permissions:
  contents: read

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
      - name: PR Conventional Commit Validation
        if: github.event_name == 'pull_request'
        uses: ytanikin/pr-conventional-commits@fda730cb152c05a849d6d84325e50c6182d9d1e9 # ytanikin/pr-conventional-commits@1.5.1 | main
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert","build"]'
          add_label: 'false'
      - name: Failure case
        if: failure() && github.event_name == 'pull_request'
        run: |
          echo "Make sure the PR title/commit follows https://www.conventionalcommits.org/"
          exit 1
