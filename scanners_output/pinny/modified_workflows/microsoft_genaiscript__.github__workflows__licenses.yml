name: refresh 3rd party licenses
permissions:
    actions: read
    contents: write
    pull-requests: write
on:
    workflow_dispatch:
    push:
        branches: [dev]
        paths:
            - "yarn.lock"
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
              with:
                  submodules: "recursive"
                  fetch-depth: 0
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4 | releases,v4.4.0
              with:
                  node-version: "22"
                  cache: yarn
            - run: yarn install --frozen-lockfile
            - run: yarn compile
            - run: yarn gen:licenses
            - uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # stefanzweifel/git-auto-commit-action@v5 | v5.2.0
              with:
                  file_pattern: "THIRD_PARTY_LICENSES.md"
                  commit_message: "3rd party license update"
                  commit_user_name: "genaiscript"
