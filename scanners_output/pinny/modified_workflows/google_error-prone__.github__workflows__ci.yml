name: CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

permissions:
  contents: read #  to fetch code (actions/checkout)

jobs:
  test:
    permissions:
      actions: write #  to cancel/stop running workflows (styfle/cancel-workflow-action)
      contents: read #  to fetch code (actions/checkout)

    name: "JDK ${{ matrix.java }} on ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        java: [ 25, 21 ]
        experimental: [ false ]
        # Only test on macos and windows with a single recent JDK to avoid a
        # combinatorial explosion of test configurations.
        # Most OS-specific issues are not specific to a particular JDK version.
        include:
          - os: macos-latest
            java: 25
            experimental: false
          - os: windows-latest
            java: 25
            experimental: false
          - os: ubuntu-latest
            java: 25
            experimental: false
          - os: ubuntu-latest
            java: 23
            experimental: false
          - os: ubuntu-latest
            java: EA
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Cancel previous
        uses: styfle/cancel-workflow-action@01ce38bf961b4e243a6342cbade0dbc8ba3f0432 # styfle/cancel-workflow-action@0.12.0
        with:
          access_token: ${{ github.token }}
      - name: 'Check out repository'
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # actions/checkout@v3 | releases,v3.6.0
      - name: 'Set up JDK 21'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # actions/setup-java@v4 | releases,v4.8.0
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'maven'
      - name: 'Set up JDK 25'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # actions/setup-java@v4 | releases,v4.8.0
        with:
          java-version: 25
          distribution: 'zulu'
          cache: 'maven'
      - name: 'Set up JDK 27 from jdk.java.net'
        uses: oracle-actions/setup-java@ec7274acdd237c7fe61395ed2edda22d756b5afe # oracle-actions/setup-java@v1
        with:
          website: jdk.java.net
          release: 27
          cache: 'maven'
      - name: 'Set up JDK ${{ matrix.java }} from jdk.java.net'
        if: ${{ matrix.java == 'EA' }}
        uses: oracle-actions/setup-java@ec7274acdd237c7fe61395ed2edda22d756b5afe # oracle-actions/setup-java@v1
        with:
          website: jdk.java.net
          release: ${{ matrix.java }}
          cache: 'maven'
      - name: 'Set up JDK ${{ matrix.java }}'
        if: ${{ matrix.java != 'EA' }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # actions/setup-java@v4 | releases,v4.8.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'zulu'
          cache: 'maven'
      - name: 'Install'
        shell: bash
        run: mvn install -DskipTests=true -Dmaven.javadoc.skip=true -B -V
      - name: 'Test'
        shell: bash
        run: mvn test -B
      - name: 'Javadoc'
        shell: bash
        run: mvn -P '!examples' javadoc:javadoc

  publish_snapshot:
    name: 'Publish snapshot'
    needs: test
    if: github.event_name == 'push' && github.repository == 'google/error-prone' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
      - name: 'Set up JDK 25'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # actions/setup-java@v4 | releases,v4.8.0
        with:
          java-version: 25
          distribution: 'zulu'
          cache: 'maven'
      - name: 'Set up JDK 21'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # actions/setup-java@v4 | releases,v4.8.0
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'maven'
          server-id: sonatype-nexus-snapshots
          server-username: CI_DEPLOY_USERNAME
          server-password: CI_DEPLOY_PASSWORD
      - name: 'Publish'
        env:
          CI_DEPLOY_USERNAME: ${{ secrets.CI_DEPLOY_USERNAME }}
          CI_DEPLOY_PASSWORD: ${{ secrets.CI_DEPLOY_PASSWORD }}
        run: mvn source:jar deploy -B -DskipTests=true -Dinvoker.skip=true

  generate_docs:
    permissions:
      contents: write #  for git push

    name: 'Generate latest docs'
    needs: test
    if: github.event_name == 'push' && github.repository == 'google/error-prone' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
      - name: 'Set up JDK 25'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # actions/setup-java@v4 | releases,v4.8.0
        with:
          java-version: 25
          distribution: 'zulu'
          cache: 'maven'
      - name: 'Set up JDK 23'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # actions/setup-java@v4 | releases,v4.8.0
        with:
          java-version: 23
          distribution: 'zulu'
          cache: 'maven'
      - name: 'Set up JDK 21'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # actions/setup-java@v4 | releases,v4.8.0
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'maven'
      - name: 'Generate latest docs'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./util/generate-latest-docs.sh
