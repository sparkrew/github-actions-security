name: facebookresearch/nevergrad/main
on:
  push:
    branches:
      - main
jobs:
  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5 | releases,v5.6.0
        with:
          python-version: '3.9'
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # actions/checkout@v4.1.0
      - uses: "./.github/actions/ubuntu_restore_all"
      - name: Check links
        run: |
          . venv/bin/activate
          cd docs/
          make linkcheck
