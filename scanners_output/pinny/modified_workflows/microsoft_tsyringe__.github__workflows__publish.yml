name: Publish
on:
  push:
    branches:
      - master

jobs:
  publish_to_npm:
    name: Publish to NPM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4 | releases,v4.4.0
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Check if version bump
        id: check
        uses: EndBug/version-check@4bd0231ddad45617279b02f5a2241bc00d48ea7f # EndBug/version-check@v1.1.1

      - name: Log when unchanged
        if: steps.check.outputs.changed != 'true'
        run: echo "No version change"

      - name: Install deps
        if: steps.check.outputs.changed == 'true'
        run: yarn
        env:
          CI: true

      - name: Build
        if: steps.check.outputs.changed == 'true'
        run: yarn build
        env:
          CI: true

      - name: Set NPM Token
        if: steps.check.outputs.changed == 'true'
        uses: filipstefansson/set-npm-token-action@8c885037600dcbc26b36df817527ec85ab4f58ac # filipstefansson/set-npm-token-action@v1
        with:
          token: ${{ secrets.NPM_TOKEN }}

      - name: Publish new version
        if: steps.check.outputs.changed == 'true'
        run: npm publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
