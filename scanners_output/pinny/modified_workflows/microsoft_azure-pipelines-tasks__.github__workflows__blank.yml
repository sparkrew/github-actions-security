name: Labeler
on:
  issues:
    types: [opened]

jobs:
  label:

    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - uses: actions/checkout@50fbc622fc4ef5163becd7fab6573eac35f8462e # actions/checkout@v1
    - uses: damccorm/tag-ur-it@4689c0ef99e78276b2ff4851db5deec57bb3f615 # damccorm/tag-ur-it@master
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        configuration-path: "./issue-rules.yml"

    - name: Set Node.js 20.x
      uses: actions/setup-node@60c11408891ef62846c29c28c2374afe5c91fad5 # actions/setup-node@master | 1179,229,260,320
      with:
        version: 20.x

    # Need to explicitly install @octokit/rest seperately or else it will mess with our typings.
    - run: npm ci && npm install @octokit/rest@18.12.x

    - name: File bugs
      run: node ci/file-bugs.js
      env:
        GITHUB_PAT: "${{ secrets.GITHUB_TOKEN }}"
        AZP_PAT: "${{ secrets.AZP_TOKEN }}"
