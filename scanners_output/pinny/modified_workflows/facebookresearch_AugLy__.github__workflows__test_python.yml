name: test_python
on:
  pull_request:
    branches: main
  push:
    branches: main
jobs:
  test_python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # actions/checkout@v2 | releases,850,v2.7.0
      - uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # actions/setup-python@v2 | releases,v2.3.4
        with:
          python-version: '3.9'
      - run: sudo apt-get update
      - run: sudo apt-get install --fix-missing ffmpeg python3-soundfile
      - run: pip install pyre-check pytest imagehash
      - run: pip install -e .[all]
      - run: pyre --source-directory "." --noninteractive check || true
      - run: pytest --durations=10 .
