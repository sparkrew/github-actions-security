name: markdownlint
on:
  push:
    paths:
      - '**/*.md'
      - '.markdownlint.json'
      - '!third_party/**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  mdlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
      - name: markdownlint-cli
        uses: nosborn/github-action-markdown-cli@508d6cefd8f0cc99eab5d2d4685b1d5f470042c1 # nosborn/github-action-markdown-cli@v3
        with:
          files: '**/*.md'
          config_file: '.markdownlint.json'
          ignore_files: 'third_party/*'
