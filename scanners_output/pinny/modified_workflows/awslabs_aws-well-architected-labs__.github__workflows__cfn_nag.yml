name: 'PRODUCTION - CFN-NAG check via Github Actions'


on: [push]

jobs:
  Cloudformation-checker:
    name: Check CFN security concerns
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # actions/checkout@v2 | releases,850,v2.7.0
      # Removing linting for now... not sure how helpful it is
      # - name: cfn-lint-action
      #   uses: docker://ghcr.io/scottbrenner/cfn-lint-action@sha256:359405ee3a03ae20eab66d5bbf7047f8a016d571dd1b696f68ba3fe8f632cee8 # docker://ghcr.io/scottbrenner/cfn-lint-action:master
      #   with:
      #     args: "static/**/*.yaml"
      - name: cfn-nag-action
        uses: stelligent/cfn_nag@8b5f03da74202ba323a145e9d037ddce6cab9dec # stelligent/cfn_nag@master
        with:
          input_path: "static"
          extra_args: --ignore-fatal
      - name: cfn-lint-notification
        if: failure()
        uses: 8398a7/action-slack@77eaa4f1c608a7d68b38af4e3f739dcd8cba273e # 8398a7/action-slack@v3 | v3.19.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.RoomWebHookUrl }} # required
        with:
          status: custom
          fields: workflow,job,commit,repo,ref,author,took
          custom_payload: |
                          {
                            Content: ":rotating_light: \n ${{ github.job }} job in worflow ${{ github.workflow }} of ${{ github.repository }} has ${{ job.status }} \n Link to GitHub Action run: https://github.com/${{ github.repository }}/commit/${{ github.sha }}/checks \n:rotating_light:"
                          }
          webhook: ${{ secrets.RoomWebHookUrl }}



