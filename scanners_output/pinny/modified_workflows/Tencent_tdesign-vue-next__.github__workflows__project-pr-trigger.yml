# https://github.com/TDesignOteam/tdesign-projects-action

name: project-pr-trigger

on:
  pull_request_target:
    types: [opened, reopened, closed]

jobs:
  project-pr-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: pr to project
        uses: TDesignOteam/tdesign-projects-action@42fa9e30c2e4795a949203a75563f5b271cbd6aa # TDesignOteam/tdesign-projects-action@main | 0.0.3
        env:
          GH_TOKEN: ${{ secrets.TDESIGN_BOT_TOKEN }}
          PROJECT_TYPE: PR2TRIGGER
          PROJECT_ID: 1
