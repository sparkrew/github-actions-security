name: QA whole library
on:
  schedule:
    - cron: "12 1 * * *"
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: macos-latest # More RAM, heh heh
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
        with:
          ref: main
          lfs: true
      - name: Grab fontspector database
        run: |
          mkdir -p ~/.ssh/
          echo "$CORVEL_SSH_PRIVATE_KEY" > ../private.key
          sudo chmod 600 ../private.key
          echo "$CORVEL_KNOWNHOSTS" > ~/.ssh/known_hosts
          scp -i ../private.key fontspector@corvelsoftware.co.uk:fontspector.db .
        shell: bash
        env:
          CORVEL_SSH_PRIVATE_KEY: ${{secrets.CORVEL_SSH_PRIVATE_KEY}}
          CORVEL_KNOWNHOSTS: ${{secrets.CORVEL_KNOWNHOSTS}}
      - name: Install protoc
        run: brew install protobuf
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@a0b538fa0b742a6aa35d6e2c169b4bd06d225a98 # actions-rust-lang/setup-rust-toolchain@v1 | main,v1.15,v1.15.3
      - name: Build fontspector
        run: cargo install --git https://github.com/fonttools/fontspector --features duckdb fontspector
      - name: Test all the things
        run: fontspector --profile googlefonts ofl/*/*{.ttf,.pb,.html,.svg,.jpg,.gif} --skip-network --succinct --duckdb fontspector.db || true
      - name: Stash database again
        run: "scp -i ../private.key fontspector.db fontspector@corvelsoftware.co.uk:"
      - name: Upload results
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # stefanzweifel/git-auto-commit-action@v5 | v5.2.0
        with:
          branch: gh-pages
          file_pattern: fontspector-dashboard
