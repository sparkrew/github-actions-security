name: Check server files
on:
  pull_request:
    paths:
    - 'to_sandbox.txt'
    - 'to_production.txt'
    - '.github/workflows/pushlists.yaml"'

jobs:
  test_server_files:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # actions/checkout@v3 | releases,v3.6.0
    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # actions/setup-python@v4 | restore-v4-release,v4.9.1
      with:
        python-version: "3.10"
    - name: Install gftools
      run: pip install gftools
    - name: Lint server files
      run: |
        gftools push-status . --lint
