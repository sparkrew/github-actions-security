name: Triage Bot
on:
  issues:
    types:
      - opened

jobs:
  triage-issue:
    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # actions/github-script@v8 | v8.0.0
        with:
          script: |
            const config = require('./.github/triage-bot.config.json');
            const run = require('./scripts/triage-bot');
            await run({github,context,core,config});
