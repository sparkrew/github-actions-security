name: Test Coverage

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  coverage:
    name: Check Test Coverage
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
    
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # actions/setup-dotnet@v4 | releases,v4.3.1
      with:
        dotnet-version: '10.0.x'
    
    - name: Run coverage check
      run: |
        chmod +x ./coverage.sh
        ./coverage.sh 80
      env:
        OLLAMA_AVAILABLE: "false"
        MIN_COVERAGE: 80
    
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4 | v4.6.2
      with:
        name: coverage-report
        path: TestResults/*/coverage.cobertura.xml
        if-no-files-found: warn
