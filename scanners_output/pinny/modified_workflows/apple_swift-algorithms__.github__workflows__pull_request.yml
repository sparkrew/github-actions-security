name: Pull request

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  validate_format_config:
    name: Validate Format Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
      - name: Install apt dependencies
        run: sudo apt-get -qq update && sudo apt-get -qq -y install curl
      - name: Compare against swift-mmio swift-format config
        run: |
          curl -sL https://raw.githubusercontent.com/apple/swift-mmio/refs/heads/main/.swift-format -o .swift-format-mmio
          diff .swift-format .swift-format-mmio

  tests:
    name: Test
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@d7f8c780c9994917d6088e165e0fee6fb0bd06a1 # swiftlang/github-workflows/.github/workflows/swift_package_test.yml@main
    with:
      enable_wasm_sdk_build: true

  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@d7f8c780c9994917d6088e165e0fee6fb0bd06a1 # swiftlang/github-workflows/.github/workflows/swift_package_test.yml@main
