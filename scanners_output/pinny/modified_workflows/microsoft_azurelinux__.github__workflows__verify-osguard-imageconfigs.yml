name: Verify osguard imageconfigs are up-to-date

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify-osguard-imageconfigs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5 | releases,v5.6.0
        with:
          python-version: '3.x'

      - name: Install Python dependencies for merge_yaml
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run osguard imageconfigs test
        working-directory: toolkit/scripts
        shell: bash
        run: |
          set -euo pipefail
          ./generate-osguard-imageconfigs.sh test
