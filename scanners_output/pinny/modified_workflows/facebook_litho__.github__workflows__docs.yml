name: Docs

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # actions/checkout@v3 | releases,v3.6.0
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # actions/setup-java@v3 | releases,v3.14.1
        with:
          distribution: 'adopt'
          java-version: 17
      - name: Gradle caches
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # actions/cache@v3 | v3.5.0-working,1656,v3.5.0
        with:
          path: ~/.gradle/caches
          key: caches-${{ runner.os }}-${{ hashFiles('**/*.gradle') }}
      - name: Gradle wrapper caches
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # actions/cache@v3 | v3.5.0-working,1656,v3.5.0
        with:
          path: ~/.gradle/wrapper
          key: wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Generate Reference Docs
        run:
          ./gradlew dokkaHtmlMultiModule

      - name: Install and Build
        run: |
          yarn
          yarn build
        working-directory: website/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # JamesIves/github-pages-deploy-action@v4 | releases,v4.8.0
        with:
          branch: gh-pages
          folder: website/build
