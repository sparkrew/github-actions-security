name: genai commit tests
permissions:
    contents: read
    models: read
on:
    push:
        branches: [main, dev]
    pull_request:
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22]
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
              with:
                  submodules: "recursive"
                  fetch-depth: 10
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4 | releases,v4.4.0
              with:
                  node-version: "${{ matrix.node-version }}"
                  cache: yarn
            - run: sudo apt-get update && sudo apt-get install ffmpeg
            - run: yarn install --frozen-lockfile --prefer-offline
            - name: compile
              run: yarn compile:action
            - name: echo tests
              run: yarn test:scripts -g commit -p github --test-timeout 60
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
