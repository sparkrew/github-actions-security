name: Code formatting

# see: https://help.github.com/en/actions/reference/events-that-trigger-workflows
on:
  pull_request: {}

defaults:
  run:
    shell: bash

permissions: {}
jobs:

  pre-commit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # actions/checkout@v3 | releases,v3.6.0
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # actions/setup-python@v4 | restore-v4-release,v4.9.1
      - name: Set $PY environment variable
        run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> $GITHUB_ENV
      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # actions/cache@v3 | v3.5.0-working,1656,v3.5.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ env.PY }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - uses: pre-commit/action@646c83fcd040023954eafda54b4db0192ce70507 # pre-commit/action@v3.0.0
