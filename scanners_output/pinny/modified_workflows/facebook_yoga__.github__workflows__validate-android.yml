name: Validate Android

on:
  pull_request:
  push:
    branches:
      - main
      - 'release-*'
  workflow_dispatch:

jobs:
  build:
    name: Build [${{ matrix.os }}][${{ matrix.mode }}]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        mode: [Debug, Release]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # actions/checkout@v3 | releases,v3.6.0

      - name: Setup
        uses: ./.github/actions/setup-android

      - name: Build
        run: ./gradlew assemble${{ matrix.mode }} --stacktrace
