name: CI

on:
  pull_request:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build_dev:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # actions/checkout@v2 | releases,850,v2.7.0
      
      - name: Install deps
        run: sudo npm install -g @angular/cli

      - name: Check dev build
        run: cd v2 && make dev

  build_prod:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # actions/checkout@v2 | releases,850,v2.7.0
      
      - name: Install deps
        run: sudo npm install -g @angular/cli

      - name: Check prod build
        run: cd v2 && make prod

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # actions/checkout@v2 | releases,850,v2.7.0
      
      - name: Install deps
        run: sudo npm install -g @angular/cli

      - name: Check unit tests
        run: cd v2 && make test
