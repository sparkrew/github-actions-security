name: Doc Build

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  pull_request:
    types: opened
    branches:
      - main
    paths:
      - 'docs/**'

jobs:
  build_docs_job:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.6]
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
    - name: Dependencies
      run: |
        echo `python3 --version`
        sudo apt-get install -y python3-sphinx
        python3 -m pip install --upgrade pip
        python3 -m pip install setuptools
      id: build
    - name: Build the docset
      run: |
        cd docs
        pip install -r requirements.txt
        make html
    - name: Get output time
      run: echo "The time was ${{ steps.build.outputs.time }}"
    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # JamesIves/github-pages-deploy-action@v4 | releases,v4.8.0
      with:
        BRANCH: gh-pages # The branch the action should deploy to
        FOLDER: ./docs/build/html # The folder the action should deploy
