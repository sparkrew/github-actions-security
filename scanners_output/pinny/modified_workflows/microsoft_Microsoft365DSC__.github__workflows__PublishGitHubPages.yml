name: Generate Resources & Deploy GitHub Pages
on:
  push:
    branches:
      - Master
      - Dev

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  GenerateResource:
    runs-on: windows-latest

    # Only run in main repo
    if: github.repository == 'microsoft/Microsoft365DSC'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1

      - name: Import Module & Generate Documentation
        shell: pwsh
        run: |
          Import-Module -Name "./Modules/Microsoft365DSC"
          Update-M365DSCResourceDocumentationPage -SourcePath ./Modules/Microsoft365DSC
          New-M365DSCCmdletDocumentation

      - name: Upload documentation as artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # actions/upload-artifact@v6 | v6.0.0
        with:
          name: docs-generation
          path: ./docs  # the folder containing the mkdocs.yml and generated docs

  deploy:
    needs: GenerateResource
    runs-on: ubuntu-latest

    # Only run in main repo
    if: github.repository == 'microsoft/Microsoft365DSC'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5 | releases,v5.6.0
        with:
          python-version: '3.x'

      - run: |
          pip install mkdocs-material
          pip install mkdocs-include-dir-to-nav

      - name: Download generated docs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # actions/download-artifact@v7 | v7.0.0
        with:
          name: docs-generation
          path: ./docs

      - name: Build site
        working-directory: ./docs
        run: mkdocs build --site-dir ../site

      - name: Upload built site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # actions/upload-pages-artifact@v4 | main,v4.0.0
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # actions/deploy-pages@v4 | v4.0.5
