name: Test real GitHub Actions cache service

on:
  schedule:
    - cron: '14 7 * * *' # 6:07AM PST / 7:07AM PDT
  workflow_dispatch:

jobs:
  tests:
    strategy:
      matrix:
        include:
          - node: 20 # LTS
            os: ubuntu-22.04

    runs-on: ${{ matrix.os }}

    env:
      WIREIT_LOGGER: 'quiet-ci'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # actions/setup-node@v6 | main,v6.3.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The goal here is to always run the full caching test suite against the
      # live GitHub Actions Cache service, even if none of our code has changed,
      # in case something changed on the backend.
      #
      # So, slightly confusingly, although we disable caching of the top-level
      # test script below, we do need the runner environment set up to allow
      # GitHub caching.
      - uses: google/wireit@f21db1f3a6a4db31f42787a958cf2a18308effed # google/wireit@setup-github-actions-caching/v2 | setup-github-actions-caching,setup-github-actions-caching,setup-github-actions-caching

      - run: npm ci
      - run: npm run test:cache-github-real
        env:
          WIREIT_CACHE: none
