name: '[gh] pull request review'

on:
  pull_request_review:
    types: [ submitted, edit ]

jobs:
  pull_request_review:
    if: github.repository == 'Tencent/Hippy'
    runs-on: ubuntu-latest
    steps:
    - name: Commit
      env:
        DATA: ${{ toJSON(github.event) }}
      run: |
        echo $DATA > ./data
    - name: Push
      uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # actions/upload-artifact@v3 | v3,v3.2.1
      with:
        name: data
        path: ./data
