name: Update Java API Docs

# Run when the Java API changes or every month so that the artifact does not expire
on:
  push:
    branches:
      - main
    paths:
      - java/**
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: "apidocs-java"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Generate Java docs
    runs-on: [
        "self-hosted",
        "1ES.Pool=onnxruntime-github-Ubuntu2204-AMD-CPU",
        "JobId=apidocs-java-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
        ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
      - name: Set up JDK 11
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # actions/setup-java@v5 | v5.2.0
        with:
          java-version: '11'
          distribution: 'adopt'
      - name: Build with Gradle
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # gradle/gradle-build-action@v3
        with:
          build-root-directory: java
          gradle-executable: java/gradlew
          arguments: javadoc
      - name: Log source commit
        run: git rev-parse --short HEAD > java/build/docs/javadoc/source-version.txt
      - name: Move Java docs into site
        run: |
          rm -rf _site/docs/api/java
          mkdir -p _site/docs/api
          mv java/build/docs/javadoc _site/docs/api/java
      - name: Upload new site
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # actions/upload-artifact@v6 | v6.0.0
        with:
          name: onnxruntime-java-apidocs
          path: _site
          retention-days: 10
