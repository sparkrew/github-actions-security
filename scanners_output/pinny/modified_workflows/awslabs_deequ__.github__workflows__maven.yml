name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # actions/checkout@v3 | releases,v3.6.0
    - name: Set up JDK 8
      uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # actions/setup-java@v3 | releases,v3.14.1
      with:
        java-version: '8'
        distribution: 'corretto'
        cache: maven
    - name: Build with Maven
      run: mvn clean verify

