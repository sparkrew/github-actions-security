name: genai docs
permissions:
    pull-requests: write
    contents: write
    models: read
on:
    workflow_dispatch:
    pull_request:
        types: [review_requested]
        paths:
            - "packages/**/*.ts"
concurrency:
    group: docs-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    gen-docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
              with:
                  submodules: "recursive"
                  fetch-depth: 10
                  ref: ${{ github.head_ref }}
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4 | releases,v4.4.0
              with:
                  node-version: "22"
                  cache: yarn
            - run: yarn install --frozen-lockfile
            - name: compile
              run: yarn compile
            - name: git fetch dev
              run: git fetch origin && git pull origin dev:dev
            - name: /docs
              run: node packages/cli/built/genaiscript.cjs run docs "packages/**/*.ts" --out ./temp/genai/docs -prc -p github --out-trace $GITHUB_STEP_SUMMARY --vars diff=true --vars pretty=true --vars applyEdits=true --vars defaultBranch=dev
              env:
                  DEBUG: "script*"
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITHUB_COMMIT_SHA: ${{ github.event.pull_request.base.sha}}
            - name: typecheck
              run: yarn typecheck
            - name: git status
              run: git status
            - name: commit
              uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # stefanzweifel/git-auto-commit-action@v5 | v5.2.0
              with:
                  commit_message: "genai: /docs [skip ci]"
                  commit_user_name: "genaiscript"
            - name: archive
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4 | v4.6.2
              with:
                  name: genai-results
                  path: ./temp/genai/**
