name: CI Health
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    
permissions:
    id-token: write # This is required for requesting the JWT

jobs:
  canaries-v3:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_AWS_ROLE_ARN }}
          aws-region: us-west-2
          role-duration-seconds: 10800
      - name: Run Canaries V3
        uses: aws-actions/aws-codebuild-run-build@4d15a47425739ac2296ba5e7eee3bdd4bfbdd767 # aws-actions/aws-codebuild-run-build@v1 | v1.0,v1.0.18
        with:
          project-name: sagemaker-python-sdk-ci-health-canaries-v3
          source-version: refs/heads/master
  canaries-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_AWS_ROLE_ARN }}
          aws-region: us-west-2
          role-duration-seconds: 10800
      - name: Run Canaries V2
        uses: aws-actions/aws-codebuild-run-build@4d15a47425739ac2296ba5e7eee3bdd4bfbdd767 # aws-actions/aws-codebuild-run-build@v1 | v1.0,v1.0.18
        with:
          project-name: sagemaker-python-sdk-ci-health-canaries-v2
          source-version: refs/heads/master-v2
