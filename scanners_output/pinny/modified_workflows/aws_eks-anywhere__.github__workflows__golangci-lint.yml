name: golangci-lint
on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:
    paths:
    - '**.go'
permissions:
  contents: read
  pull-requests: read
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # actions/setup-go@v5 | releases,v5.6.0
        with:
          go-version: "1.24"
          check-latest: true
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          only-new-issues: true
          args: --timeout 10m
