name: GitHub Pages
on:
    workflow_dispatch:
    push:
        branches:
            - main
            - dev
#        tags:
#            - "[0-9]+.[0-9]+.[0-9]+"
permissions:
    contents: write
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
              with:
                  submodules: "recursive"
                  fetch-depth: 10
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4 | releases,v4.4.0
              with:
                  node-version: "22"
                  cache: yarn
            - run: yarn install --frozen-lockfile
            - run: yarn playwright install
            - name: compile
              run: yarn compile:action
            - name: Build slides
              run: yarn build:slides
            - name: Build docs
              run: yarn build:docs
            - name: no jekyll
              run: touch docs/dist/.nojekyll
            - name: Deploy 🚀
              uses: JamesIves/github-pages-deploy-action@920cbb300dcd3f0568dbc42700c61e2fd9e6139c # JamesIves/github-pages-deploy-action@v4.6.4
              with:
                  folder: docs/dist
                  single-commit: true
