name: Docs

on: [push, pull_request]

defaults:
  run:
    shell: bash

jobs:
  docs-build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # actions/checkout@v3 | releases,v3.6.0
    - uses: extractions/setup-just@69d82fb0233557aec017ef13706851d0694e0f1d # extractions/setup-just@v1 | v1.6.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # actions/setup-python@v4 | restore-v4-release,v4.9.1
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        pip install ".[arrow]" \
          -r requirements/requirements-docs.txt \
          -r requirements/requirements-mxnet.txt \
          -r requirements/requirements-pytorch.txt \
          -r requirements/requirements-rotbaum.txt \
          -r requirements/requirements-extras-statsforecast.txt

    - name: Install Pandoc
      run: |
        sudo apt-get install pandoc

    - name: Build docs
      run: |
        SKIP_NOTEBOOKS=${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'pr:docs-build-notebook') }}
        if [ $SKIP_NOTEBOOKS = true ]; then
          DOCS_BUILD_MODE=skip
        else
          DOCS_BUILD_MODE=release
        fi
        echo "Running in '$DOCS_BUILD_MODE' mode"
        just mode=$DOCS_BUILD_MODE docs

    - name: Configure AWS Credentials
      if: ${{ github.event_name == 'push' && ( github.ref_name == 'dev' || startsWith(github.ref_name, 'v0.')) }}
      uses: aws-actions/configure-aws-credentials@5fd3084fc36e372ff1fff382a39b10d03659f355 # aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::671929771060:role/WebsitePublisher
        role-session-name: docs-push
        aws-region: us-east-1

    - name: Publish docs
      if: ${{ github.event_name == 'push' }}
      run: |
        aws s3 sync docs/_build/html s3://gluonts-website/${GITHUB_REF#refs/heads/} --delete --acl bucket-owner-full-control
