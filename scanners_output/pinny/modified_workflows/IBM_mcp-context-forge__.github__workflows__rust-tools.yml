name: Rust Tools CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - "tools_rust/**"
      - ".github/workflows/rust-tools.yml"
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches: [main, develop, rust-tools-ci]
    paths:
      - "tools_rust/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Rust Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1

      - name: Install Rust components
        run: |
          rustup toolchain install stable
          rustup component add rustfmt clippy
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # actions/cache@v4 | v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools_rust/wrapper/target
          key: ${{ runner.os }}-cargo-wrapper-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        working-directory: tools_rust/wrapper
        run: cargo fmt --check

      - name: Run cargo check
        working-directory: tools_rust/wrapper
        run: make check

      - name: Run clippy (pedantic)
        working-directory: tools_rust/wrapper
        run: make pedantic

      - name: Run tests
        working-directory: tools_rust/wrapper
        run: make test

      - name: Build release
        working-directory: tools_rust/wrapper
        run: make build-release

  security-audit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1

      - name: Install Rust stable
        run: rustup default stable

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run license check
        working-directory: tools_rust/wrapper
        run: make licenses

  coverage:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1

      - name: Install Rust stable and components
        run: |
          rustup default stable
          rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Run coverage
        working-directory: tools_rust/wrapper
        run: make coverage
