name: Publish Relay VS Code Extension
on:
  workflow_dispatch:

jobs:
  vscode-release:
    name: VSCode Extension Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./vscode-extension
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # actions/setup-node@v6 | main,v6.3.0
        with:
          node-version: 20.x
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
      - name: ESLint
        run: yarn --ignore-engines run lint
      - name: Prettier
        run: yarn --ignore-engines run prettier-check
      - name: Typecheck
        run: yarn --ignore-engines run typecheck
      - name: Publish
        run: yarn --ignore-engines vsce publish --pat ${{ secrets.VSCE_PAT }}
