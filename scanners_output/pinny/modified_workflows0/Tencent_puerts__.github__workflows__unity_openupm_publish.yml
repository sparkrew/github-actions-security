name: unity openupm publish

on: 
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'tag name'     
        required: true

env:
  RUNID: 613573412

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # actions/checkout@v3 | releases,v3.6.0
      - name: publish webgl openupm package
        run: |
          git filter-branch --subdirectory-filter upms/webgl
          git clean -ffdx
          git tag upm/webgl/${{ github.event.inputs.tag_name }}
          git push origin --tag
