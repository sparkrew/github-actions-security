# GitHub Action to automate the identification of common misspellings in text files.
# https://github.com/codespell-project/actions-codespell
# https://github.com/codespell-project/codespell
name: codespell
on: [push, pull_request]
permissions:
  contents: read

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # actions/checkout@v2 | releases,850,v2.7.0
      - uses: codespell-project/actions-codespell@bca0a5887de255a8903221c67b6478c7501c5edc # codespell-project/actions-codespell@master
        with:
          check_filenames: true
          skip: ./.git,*.yml,*.yaml,./.github/workflows/codespell.yml,.git,*.png,*.jpg,*.svg,*.sum,./vhd-notes/*,*.ics,./website/package-lock.json
          ignore_words_list: AKS,aks,nd,aci,rouge,IST,ist
