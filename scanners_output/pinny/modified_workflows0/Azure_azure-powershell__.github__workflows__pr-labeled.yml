name: pr-labeled
run-name: Triggered by pr label
env:
  GH_TOKEN: ${{ github.token }}
  PR: ${{ github.event.pull_request.html_url }}
on:
  pull_request_target:
    types:
      - labeled
jobs:
  process_labels:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4 | releases,v4.3.1
      with:
        sparse-checkout: |
          .github
    - name: process label
      shell: pwsh
      env:
        LABEL: ${{ github.event.label.name }}
      run: .github/workflows/script/PrLabeled.ps1 -LabelName $env:LABEL -PrUrl $env:PR
