name: License checker

on:
  push:
    branches:
      - 2024
      - 2023
      - 2022
      - 2021
      - 2020
      - hoxton
      - greenwich
      - release/*
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - 2024
      - 2023
      - 2022
      - 2021
      - 2020
      - hoxton
      - greenwich
      - release/*
    paths-ignore:
      - '**.md'
jobs:
  check-license:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6 | v6.0.2
      - name: Check License Header
        uses: apache/skywalking-eyes@61275cc80d0798a405cb070f7d3a8aaf7cf2c2c1 # apache/skywalking-eyes@v0.8.0
