name: pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Set node version to 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm bootstrap

      - name: Build VuePress site
        run: npm run docs:build

      - name: Build Playground site
        run: npm run build:playground

      - name: clean dist
        run: rm -rf dist

      - name: mkdir dist
        run: mkdir dist && mkdir dist/docs && mkdir dist/playground

      - name: move to dist
        run: mv docs/.vitepress/dist/* dist/docs && mv playground/dist/* dist/playground

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@59173cb633d9a3514f5f4552a6a3e62c6710355c # v2
        with:
          target_branch: gh-pages
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
