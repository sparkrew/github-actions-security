name: Notebooks
on: push

jobs:
  run-notebooks:
    runs-on: 4-core-ubuntu-gpu-t4
    steps:
      - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
      - uses: mamba-org/setup-micromamba@422500192359a097648154e8db4e39bdb6c6eed7 # v1.8.1
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Check GPU availability
        shell: bash -l {0}
        run: |
          python -c "import torch; print('Is CUDA available:', torch.cuda.is_available())"

      - name: Run notebooks
        shell: bash -l {0}
        run: |
          set -e
          export PYTHONPATH=${PWD}:$PYTHONPATH
          for file in examples/*.ipynb; do
            jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=600 "$file"
          done
