name: Minimal Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  Check:

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        platform: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          - python-version: "3.13"
            platform: windows-latest
          - python-version: "3.14"
            platform: windows-latest
    env:
      AWS_DEFAULT_REGION: us-east-1

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Rust latest
        run: rustup update
      - name: Install uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7
        with:
          enable-cache: true
      - name: Install Requirements
        run: uv sync --frozen --dev --verbose
        working-directory: ${{ github.workspace }}
      - name: Test Metadata
        run: uv run pytest tests/unit/test_metadata.py
        working-directory: ${{ github.workspace }}
      - name: Test Session
        run: uv run pytest tests/unit/test_session.py
        working-directory: ${{ github.workspace }}
      - name: Test Utils
        run: uv run pytest tests/unit/test_utils.py
        working-directory: ${{ github.workspace }}
      - name: Test Moto
        run: uv run pytest -n 4 tests/unit/test_moto.py
        working-directory: ${{ github.workspace }}
