name: Validate distributions

on: 
  pull_request: 
    paths: ['distributions/**']

jobs:
  check:
    name: Validate distributions
    runs-on: ubuntu-latest
    steps:
        - name: Checkout repo
          uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
          
        - name: Run validation
          run: python distributions/validate.py distributions/DistributionInfo.json
          shell: bash
