name: FreeBSD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

jobs:
  testfreebsd:
    runs-on: ubuntu-latest
    name: CI FreeBSD
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Build and test in FreeBSD
        id: test
        uses: vmactions/freebsd-vm@c9f815bc7aa0d34c9fdd0619b034a32d6ca7b57e # v1
        timeout-minutes: 45
        with:
          prepare: pkg install -y ninja cmake
          run: |
            freebsd-version
            .github/s2n_bsd.sh
      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@master
        with:
          name: all_test_output
          path: |
            output
