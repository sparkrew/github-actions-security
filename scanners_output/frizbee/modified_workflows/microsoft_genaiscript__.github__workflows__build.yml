name: build
permissions:
    contents: read
    models: read
on:
    push:
        branches: [main, dev]
    pull_request:
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22, 23, 24]
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  submodules: "recursive"
                  fetch-depth: 10
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "${{ matrix.node-version }}"
                  cache: yarn
            - run: sudo apt-get update && sudo apt-get install ffmpeg
            - run: yarn install --frozen-lockfile --prefer-offline
            - name: compile
              run: yarn compile:action
            - name: lint
              run: yarn lint
            - name: package vscode
              run: yarn package
            - name: compile system scripts
              run: yarn test:system
            - name: compile tests
              run: yarn test:compile
            - name: core tests
              run: yarn test:core
            - name: unit tests
              run: yarn test:samples
            - name: unit test:modulesamples
              run: yarn test:modulesamples
            - name: github models
              run: yarn genai poem -p github
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
