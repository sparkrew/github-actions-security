name: Style and type checks

on: [push, pull_request]

jobs:
  style-type-checks:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
    - uses: extractions/setup-just@69d82fb0233557aec017ef13706851d0694e0f1d # v1
    - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
          python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install .
        # todo: install also `black[jupyter]`
        pip install click "black==24.02" "mypy==1.8.0" \
            types-python-dateutil types-waitress types-PyYAML
    - name: Style check
      run: just black
    - name: Type check
      run: just mypy
    - name: Check license headers
      run: just license
