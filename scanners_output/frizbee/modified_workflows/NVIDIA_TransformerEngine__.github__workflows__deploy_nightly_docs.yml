# A workflow to deploy the nightly version of TE documentation to GitHub Pages
name: Deploy nightly docs
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    uses: ./.github/workflows/docs.yml

  prepare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
            name: "te_docs"
            path: "html"
      - name: Prepare for pages
        uses: actions/upload-pages-artifact@253fd476ed429e83b7aae64a92a75b4ceb1a17cf # v1.0.7
        with:
          name: github-pages
          path: "html"
  deploy:
    needs: prepare
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - name: Deploy
      uses: actions/deploy-pages@73e62e651178eeba977de2dc9f4c7645b3d01015 # v2.0.0
