name: Update Cargo.lock
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  update-cargo-lock:
    name: Update Cargo.lock file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          # Should stay in sync with fbcode/buck2/rust-toolchain
          # And other similar references in this file and
          # ci.yml
          toolchain: nightly-2025-12-05
          override: true
      - name: cargo check
        run: cargo check --features vendored --manifest-path=compiler/Cargo.toml
      - name: pull-request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8
        with:
          token: ${{ secrets.RELAY_BOT_GITHUB_PAT }}
          title: "Update Cargo.lock"
          branch: update-cargo-lock
          delete-branch: true
