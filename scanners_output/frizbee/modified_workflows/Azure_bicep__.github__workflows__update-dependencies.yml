name: Update Dependencies
# This action can be run on-demand against a branch.
# It attempts to update dotnet & npm dependencies, and commits and pushes changes if there are any.

on:
  workflow_dispatch:

jobs:
  main:
    name: Update Dependencies
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

      - name: Setup .NET Core
        uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309 # v5

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6

      - name: Install Tools
        run: |
          npm install -g npm-check-updates
          dotnet tool install -g dotnet-outdated-tool

      - name: Update Dependencies
        continue-on-error: true
        run: ./scripts/update_dependencies.sh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8
        with:
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          signoff: false
          branch: update-dependencies
          delete-branch: true
          title: |
            Update NPM & Dotnet Dependencies
          commit-message: |
            Update NPM & Dotnet Dependencies
          labels: dependencies
          draft: false
