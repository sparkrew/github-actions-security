name: publish-theme-generator

permissions:
  contents: read
  id-token: write

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - packages/theme-generator/package.json

  workflow_dispatch:

jobs:
  publish-theme-generator:
    if: github.event_name == 'workflow_dispatch' || (github.repository == 'Tencent/tdesign' && startsWith(github.head_ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - run: pnpm install

      - run: pnpm -F @tdesign/theme-generator run build

      - run: npm i -g npm@latest

      - name: Publish Package
        run: pnpm -F @tdesign/theme-generator publish --no-git-checks
